# Build and publish the fault-injector image to GitHub Container Registry.
# Image: ghcr.io/samualfageme/fault-injector
#
# Tags:
#   - latest on the default branch
#   - sha-<short-sha> on every push
#   - semver tags when a v* git tag is pushed
name: Publish fault-injector

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "fault-injector/**"
      - ".github/workflows/publish-fault-injector.yml"
  pull_request:
    paths:
      - "fault-injector/**"
      - ".github/workflows/publish-fault-injector.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fault-injector

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: fault-injector
          file: fault-injector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Match Makefile push: native compile, copy-only final stage; skip provenance/SBOM.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
