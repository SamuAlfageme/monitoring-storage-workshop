apiVersion: v1
kind: ConfigMap
metadata:
  name: pvc-monitoring-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pvc-monitoring.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 0,
            "datasource": { "type": "chaosmeshorg-datasource", "uid": "chaosmesh" },
            "enable": true,
            "hide": false,
            "iconColor": "rgba(255, 96, 0, 1)",
            "name": "IOChaos events",
            "target": {
              "kind": "IOChaos",
              "namespace": "default",
              "limit": 50
            }
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "kube_persistentvolumeclaim_status_phase",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} phase={{phase}}",
              "refId": "A"
            }
          ],
          "title": "PVC Bound Status",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "max": 1, "min": 0, "unit": "percentunit" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "PVC Fill %",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "max": 1, "min": 0, "unit": "percentunit" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "PVC Inode %",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "max": 1, "min": 0, "unit": "none" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            {
              "expr": "pvc_canary_write_success",
              "legendFormat": "{{namespace}}/{{pvc}}",
              "refId": "A"
            }
          ],
          "title": "Canary Write Success",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "id": 5,
          "targets": [
            {
              "expr": "rate(node_disk_io_time_seconds_total[2m])",
              "legendFormat": "{{instance}}/{{device}}",
              "refId": "A"
            }
          ],
          "title": "Disk I/O Saturation",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "alertmanager", "uid": "alertmanager" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "id": 6,
          "options": {
            "maxItems": 20,
            "sortOrder": 1
          },
          "title": "Active Alerts",
          "type": "alertlist"
        },
        {
          "datasource": { "type": "chaosmeshorg-datasource", "uid": "chaosmesh" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "id": 7,
          "options": { "showHeader": true, "cellHeight": "sm", "footer": { "show": false } },
          "targets": [
            {
              "datasource": { "type": "chaosmeshorg-datasource", "uid": "chaosmesh" },
              "kind": "IOChaos",
              "namespace": "default",
              "limit": 100,
              "refId": "A"
            }
          ],
          "title": "Chaos Mesh IOChaos Events (requires deploy-chaos + Grafana plugin)",
          "type": "table"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["pvc", "monitoring", "poc"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "PVC Monitoring POC",
      "uid": "pvc-monitoring-poc",
      "version": 1
    }
