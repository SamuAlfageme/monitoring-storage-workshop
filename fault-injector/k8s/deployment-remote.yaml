# Same as deployment.yaml but pulls from a registry (use with deploy-app-remote).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-injector
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fault-injector
  template:
    metadata:
      labels:
        app: fault-injector
    spec:
      automountServiceAccountToken: true
      serviceAccountName: fault-injector
      # __BEGIN_IMAGE_PULL_SECRETS__
      imagePullSecrets:
        - name: __IMAGE_PULL_SECRET__
      # __END_IMAGE_PULL_SECRETS__
      containers:
        - name: fault-injector
          image: __FAULT_INJECTOR_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          # No privileged mode - Pod Security baseline (common on managed clusters) blocks it.
          # Fault injection uses normal writes on mounted PVCs; kind-only deployment keeps privileged.
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: healthy
              mountPath: /data/healthy
            - name: filling
              mountPath: /data/filling
            - name: fault
              mountPath: /data/fault
          env:
            - name: PVC_MOUNTS
              value: "healthy:/data/healthy,filling:/data/filling,fault:/data/fault"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: healthy
          persistentVolumeClaim:
            claimName: pvc-healthy
        - name: filling
          persistentVolumeClaim:
            claimName: pvc-filling
        - name: fault
          persistentVolumeClaim:
            claimName: pvc-fault
---
apiVersion: v1
kind: Service
metadata:
  name: fault-injector
  namespace: default
  labels:
    app: fault-injector
spec:
  selector:
    app: fault-injector
  ports:
    - name: http
      port: 8080
      targetPort: 8080
